name: orgawork-data-local

services:
  redis:
    image: redis:7.4.10-bookworm@sha256:fe24fa2bcb59930f8863cf36a472df24efaccd8be4ee98ffe528f06d57d68dc2
    container_name: orgawork-redis
    platform: linux/amd64
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.local}
    networks:
      - orgawork_internal
    volumes:
      - orgawork_redis_data:/data
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.local}
      - --save
      - ''
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" PING)" = "PONG"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - '${REDIS_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379'

networks:
  orgawork_internal:
    name: orgawork-internal
    driver: bridge

volumes:
  orgawork_redis_data:
    name: orgawork-redis-data
