name: orgawork-data-local

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    container_name: orgawork-minio
    platform: linux/amd64
    networks:
      - orgawork_internal
    volumes:
      - orgawork_minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set in .env.local}
    command:
      - server
      - /data
      - --console-address
      - :9001
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:9000/minio/health/ready >/dev/null
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - '${MINIO_HOST:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001'

networks:
  orgawork_internal:
    name: orgawork-internal
    driver: bridge

volumes:
  orgawork_minio_data:
    name: orgawork-minio-data
