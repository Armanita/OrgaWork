name: orgawork-data-local

services:
  postgres:
    image: postgres:16.14-bookworm@sha256:c95fd5346040eba2de3c435e14874af18f5d681fb5848d4f081dbead0878af28
    container_name: orgawork-postgres
    platform: linux/amd64
    networks:
      - orgawork_internal
    volumes:
      - orgawork_postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env.local}
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - '${POSTGRES_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432'

networks:
  orgawork_internal:
    name: orgawork-internal
    driver: bridge

volumes:
  orgawork_postgres_data:
    name: orgawork-postgres-data
