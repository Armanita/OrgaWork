name: OrgaWork CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orgawork-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile

      - name: Build foundation type declarations
        run: pnpm prepare:quality

      - name: Formatting gate
        run: pnpm format:check

      - name: Code-quality gate
        run: pnpm lint

      - name: TypeScript gate
        run: pnpm typecheck

      - name: Test gate and JUnit report
        run: pnpm test:ci

      - name: Coverage report
        if: runner.os == 'Linux'
        run: pnpm test:coverage:ci

      - name: Build CI summary
        if: always() && runner.os == 'Linux'
        run: pnpm ci:report
        env:
          ORGAWORK_CI_STATUS: ${{ job.status }}

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  contracts-and-migrations:
    name: Contracts OpenAPI and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orgawork
          POSTGRES_USER: orgawork
          POSTGRES_PASSWORD: orgawork-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgawork -d orgawork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contracts and OpenAPI gate
        run: pnpm ci:contracts
      - name: Migration and schema-drift gate
        run: pnpm ci:migrations

  architecture:
    name: Architecture and repository policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package and module boundaries
        run: pnpm ci:architecture
      - name: Dependency secret and UTF-8 policy
        run: pnpm ci:security

  build:
    name: Build four applications
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Direct dependency and application builds
        run: pnpm build:apps:direct

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: High-severity production dependency audit
        run: pnpm audit --prod --audit-level=high
