name: OrgaWork CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orgawork-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
      - name: Unified quality verification
        if: runner.os == 'Windows'
        run: pnpm verify:ci -- --suite quality --continue
      - name: Unified quality and coverage verification
        if: runner.os == 'Linux'
        run: pnpm verify:ci -- --suite quality-coverage --continue
      - name: Build CI summary
        if: always() && runner.os == 'Linux'
        run: pnpm ci:report
        env:
          ORGAWORK_CI_STATUS: ${{ job.status }}
      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  contracts-and-migrations:
    name: Contracts OpenAPI and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: orgawork
          POSTGRES_USER: orgawork
          POSTGRES_PASSWORD: orgawork-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U orgawork -d orgawork"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unified contracts and migrations verification
        run: pnpm verify:ci -- --suite contracts --continue
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: contracts-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  architecture:
    name: Architecture and repository policy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unified architecture verification
        run: pnpm verify:ci -- --suite architecture --continue
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: architecture-${{ matrix.os }}-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build four applications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unified application build verification
        run: pnpm verify:ci -- --suite build --continue
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency vulnerability audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.17.0
          run_install: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unified dependency audit verification
        run: pnpm verify:ci -- --suite audit --continue
      - name: Upload verification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: audit-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
